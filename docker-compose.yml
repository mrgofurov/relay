services:
  db:
    image: postgres:16-alpine
    container_name: relay-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relay}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: relay-redis
    restart: always
    expose:
      - "6379"

  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/Dockerfile.api
    container_name: relay-api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-relay}
      SECRET_KEY: ${SECRET_KEY:-relay_dev_secret_key_change_in_production_9876543210}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    expose:
      - "8000"

  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/Dockerfile.web
    container_name: relay-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${RELAY_PORT:-3000}/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:${RELAY_PORT:-3000}/ws
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: relay-nginx
    restart: always
    ports:
      - "${RELAY_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
