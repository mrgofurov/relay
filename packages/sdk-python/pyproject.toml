[project]
name = "relay-sdk"
version = "0.1.0"
description = "Python SDK for Relay AI Agent Collaboration Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0",
]
